project:
  type: book
  output-dir: docs
  pre-render: Rscript scripts/prepare.R
  post-render: Rscript scripts/local-links.R
  resources:
    - "archives/*"
    - "study/*.csv"
    - "help/*.html"
    - ".nojekyll"

book:
  title: "skyscapeR technical manual"
  subtitle: "Methods and validation · illustrated draft of 9 November 2026"
  chapters:
    - index.qmd
    - contents-plan.qmd
    - ephemeris.qmd
    - part: "Methods"
      chapters:
        - astronomical-conventions.qmd
        - field-reduction.qmd
        - horizons.qmd
        - photographic-horizons.qmd
        - stellar-phases.qmd
        - orientation-densities.qmd
        - event-searches.qmd
        - lunar-crossovers.qmd
        - celestial-targets.qmd
        - significance.qmd
        - sky-rendering.qmd
    - part: "Function reference"
      chapters:
        - function-index.qmd
        - function-methods.qmd
        - vignette-guide.qmd
    - part: "Validation"
      chapters:
        - study-register.qmd
        - a02-ephemeris.qmd
        - heliacal-rising.qmd
    - references.qmd

bibliography: references.bib
format:
  html:
    theme: cosmo
    css: manual.css
    html-math-method: mathml
    toc: true
    fig-cap-location: bottom
lang: en-GB
